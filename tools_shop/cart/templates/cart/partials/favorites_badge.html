{# Бейдж избранного в шапке. #}
<a class="header-action" href="{% url 'cart:favorites' %}" aria-label="Избранное: {{ favorites_count }}"
   hx-get="{% url 'cart:favorites_badge' %}"
   hx-trigger="favorites-updated from:body"
   hx-target="this"
   hx-swap="outerHTML">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <span class="header-action-label">Избранное</span>
    {% if favorites_count %}<span class="header-badge">{{ favorites_count }}</span>{% endif %}
</a>
