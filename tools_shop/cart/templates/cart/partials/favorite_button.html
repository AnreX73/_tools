{# Кнопка избранного. Переключается htmx-запросом. #}
<button type="button"
        class="favorite-btn{% if is_favorite %} is-active{% endif %}"
        hx-post="{% url 'cart:favorite_toggle' product.pk %}"
        hx-target="this"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        aria-pressed="{% if is_favorite %}true{% else %}false{% endif %}"
        aria-label="{% if is_favorite %}Убрать из избранного{% else %}Добавить в избранное{% endif %}"
        title="{% if is_favorite %}В избранном{% else %}В избранное{% endif %}">
    <svg width="18" height="18" viewBox="0 0 24 24"
         fill="{% if is_favorite %}currentColor{% else %}none{% endif %}"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>
</button>
