name: tools_shop

x-app: &app
  image: tools_shop_app
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DEBUG: "False"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  web:
    <<: *app
    build: .
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      # просто проверяем, что gunicorn слушает порт 8000
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  qcluster:
    <<: *app
    command: ["python", "manage.py", "qcluster"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # порт на хост не публикуем, трафик идёт через Nginx Proxy Manager
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      backend:
      proxy:
        aliases: [tools-shop-nginx]

volumes:
  pg_data:
  redis_data:
  static_data:
  media_data:

networks:
  backend:
  proxy:
    external: true
    name: npm_default   # замените на реальное имя сети NPM