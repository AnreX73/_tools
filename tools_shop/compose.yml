x-app-env: &app-env
  DEBUG: "False"
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
services:
  nginx:
    image: nginx:stable-alpine
    container_name: hair_shop_nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - web
      - npm_default
    depends_on:
      - web

  web:
    build: .
    image: hair_shop_app
    container_name: hair_shop_web
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  qcluster:
    image: hair_shop_app
    pull_policy: never
    container_name: hair_shop_qcluster
    restart: unless-stopped
    command: python manage.py qcluster
    env_file:
      - .env
    environment: *app-env
    volumes:
      - media_volume:/app/media
    networks:
      - web
    stop_grace_period: 70s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: hair_shop_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  db:
    image: postgres:17-alpine
    container_name: hair_shop_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web:
    driver: bridge
  npm_default:
    external: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data: