<div class="support-chat" x-data="supportChat" data-start-url="{% url 'chat:start' %}" @keydown.escape="close()">
    <section id="support-chat-panel" class="chat-panel" x-show="open" x-cloak x-transition.opacity
             role="region" aria-labelledby="support-chat-title">
        <header class="chat-header">
            <div><strong id="support-chat-title">Помощь с подбором ЗИП</strong><small>Напишите модель оборудования или артикул</small></div>
            <button type="button" class="chat-close" @click="close()" aria-label="Закрыть чат">×</button>
        </header>
        {% include 'chat/messages.html' %}
    </section>
    <button type="button" class="chat-launcher" x-ref="launcher" @click="open ? close() : show()"
            :aria-expanded="open" aria-controls="support-chat-panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>
        <span>Задать вопрос</span>
    </button>
</div>
